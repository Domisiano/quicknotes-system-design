<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="QuickNotes demo client for learning REST APIs and system design.">
  <title>QuickNotes</title>
  <link rel="stylesheet" href="style.css">
  <script src="api.js" defer></script>
</head>
<body>
  <main class="app-shell">
    <header class="page-header">
      <p class="eyebrow">SYSTEM DESIGN ASSIGNMENT</p>
      <h1>QuickNotes</h1>
      <p class="subtitle">Capture an idea, keep it simple.</p>
    </header>
    <section class="panel" aria-labelledby="create-heading">
      <h2 id="create-heading">Create a note</h2>
      <form id="note-form">
        <div class="form-field">
          <label for="title-input">Title <span class="muted">(required, max 100 characters)</span></label>
          <input id="title-input" name="title" type="text" maxlength="100" required>
        </div>
        <div class="form-field">
          <label for="body-input">Note</label>
          <textarea id="body-input" name="body" rows="4" placeholder="Write your note here..."></textarea>
        </div>
        <button id="submit-btn" type="submit">Save note</button>
      </form>
    </section>
    <section class="notes-section" aria-labelledby="notes-heading">
      <div class="section-heading">
        <div><h2 id="notes-heading">Your notes</h2><p class="muted">Demo notes are provided by JSONPlaceholder.</p></div>
        <button id="load-btn" class="button-secondary" type="button">Load notes</button>
      </div>
      <p id="status" class="status" role="status" aria-live="polite">Select “Load notes” to fetch notes.</p>
      <ul id="notes-list" class="notes-list" aria-label="Notes list"></ul>
    </section>
    <footer><p>Learning project · HTML, CSS, JavaScript, REST APIs and system design</p></footer>
  </main>
</body>
</html>
